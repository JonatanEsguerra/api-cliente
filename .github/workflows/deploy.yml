name: Deploy API Cliente

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login a ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build y push de la imagen
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/api-cliente:${{ github.sha }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/api-cliente:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Login a Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy a Container Instances
        uses: azure/aci-deploy@v1
        with:
          resource-group: rg-proyecto-nube-final
          dns-name-label: api-cliente-jonatan
          image: ${{ secrets.ACR_LOGIN_SERVER }}/api-cliente:${{ github.sha }}
          registry-login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          registry-username: ${{ secrets.ACR_USERNAME }}
          registry-password: ${{ secrets.ACR_PASSWORD }}
          name: aci-api-cliente
          location: eastus
          ports: 3000
          environment-variables: |
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=5432
            DB_NAME=proyecto_db
            DB_USER=apiuser
            DB_SSL=true
            DB_SCHEMA=cliente
            PORT=3000
          secure-environment-variables: |
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
